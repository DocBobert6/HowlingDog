name: Release

# HowlingDog Phase 8: the first signed release.
#
# Triggered by pushing a `v*` tag (e.g. v0.1.0) or manually
# (workflow_dispatch). It builds the app exactly like the CI
# workflow (stock core + bridge for arm64-v8a, host core test,
# unit tests), then assembles the RELEASE APK signed with the
# fresh HowlingDog keystore, verifies the signature and that the
# APK is signed with the keystore's certificate (not the debug
# key), and publishes it as a GitHub release.
#
# The keystore comes from GitHub Secrets (ANDROID_KEYSTORE_BASE64
# is the base64 of the keystore file; KEYSTORE_PASSWORD, KEY_ALIAS
# and KEY_PASSWORD are its credentials). It is never committed to
# the repo and never printed in logs.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 27.2.12479018
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build stock core (arm64-v8a only)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BUILD="$NDK/ndk-build"
          if [ ! -x "$NDK_BUILD" ]; then
            echo "ndk-build missing from NDK 27.2.12479018: $NDK_BUILD"
            exit 1
          fi
          cd libretro/jni
          "$NDK_BUILD" -j"$(nproc)" APP_ABI=arm64-v8a APP_PLATFORM=android-21
          cd "$GITHUB_WORKSPACE"
          FOUND=$(find libretro -path "*/libs/arm64-v8a/*.so")
          COUNT=$(printf "%s\n" "$FOUND" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "expected exactly one built .so, found $COUNT:"
            printf "%s\n" "$FOUND"
            exit 1
          fi
          echo "BUILT_SO=$FOUND" >> "$GITHUB_ENV"

      - name: Run core slice unit test (host)
        run: |
          set -euo pipefail
          gcc -I src -Wall -Wextra -o /tmp/geo_slice_test tests/geo_slice_test.c
          /tmp/geo_slice_test

      - name: Run run-ahead unit test (host)
        run: |
          set -euo pipefail
          # Phase 10: the run-ahead state machine is pure C
          # (bridge/jni/runahead.c) — see android.yml for why it is
          # tested on the host.
          gcc -I bridge/jni -Wall -Wextra -o /tmp/runahead_test tests/runahead_test.c bridge/jni/runahead.c
          /tmp/runahead_test

      - name: Run RetroAchievements unit test (host)
        run: |
          set -euo pipefail
          # Phase 10: the RetroAchievements wrapper is pure C
          # (bridge/jni/ra_client.c + vendored rcheevos) — see
          # android.yml for why it is tested on the host.
          RC_SRC="deps/rcheevos/src"
          gcc -I bridge/jni -I deps/rcheevos/include -I "$RC_SRC" \
            -DRC_CLIENT_SUPPORTS_HASH -D_GNU_SOURCE -std=c99 -Wall -Wextra \
            -o /tmp/ra_client_test tests/ra_client_test.c bridge/jni/ra_client.c bridge/jni/ra_cdreader.c \
            "$RC_SRC/rc_client.c" "$RC_SRC/rc_compat.c" "$RC_SRC/rc_util.c" "$RC_SRC/rc_version.c" \
            "$RC_SRC/rcheevos/alloc.c" "$RC_SRC/rcheevos/condition.c" "$RC_SRC/rcheevos/condset.c" \
            "$RC_SRC/rcheevos/consoleinfo.c" "$RC_SRC/rcheevos/format.c" "$RC_SRC/rcheevos/lboard.c" \
            "$RC_SRC/rcheevos/memref.c" "$RC_SRC/rcheevos/operand.c" "$RC_SRC/rcheevos/rc_validate.c" \
            "$RC_SRC/rcheevos/richpresence.c" "$RC_SRC/rcheevos/runtime.c" "$RC_SRC/rcheevos/runtime_progress.c" \
            "$RC_SRC/rcheevos/trigger.c" "$RC_SRC/rcheevos/value.c" \
            "$RC_SRC/rhash/aes.c" "$RC_SRC/rhash/cdreader.c" "$RC_SRC/rhash/hash.c" \
            "$RC_SRC/rhash/hash_disc.c" "$RC_SRC/rhash/hash_encrypted.c" "$RC_SRC/rhash/hash_rom.c" \
            "$RC_SRC/rhash/hash_zip.c" "$RC_SRC/rhash/md5.c" \
            "$RC_SRC/rapi/rc_api_common.c" "$RC_SRC/rapi/rc_api_editor.c" "$RC_SRC/rapi/rc_api_info.c" \
            "$RC_SRC/rapi/rc_api_runtime.c" "$RC_SRC/rapi/rc_api_user.c" \
            -lm
          /tmp/ra_client_test

      - name: Build bridge (arm64-v8a only)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BUILD="$NDK/ndk-build"
          cd bridge/jni
          "$NDK_BUILD" -j"$(nproc)" APP_ABI=arm64-v8a APP_PLATFORM=android-21
          cd "$GITHUB_WORKSPACE"
          FOUND=$(find bridge -path "*/libs/arm64-v8a/*.so")
          COUNT=$(printf "%s\n" "$FOUND" | grep -c . || true)
          if [ "$COUNT" -ne 2 ]; then
            echo "expected exactly two built .so files (bridge + prebuilt core), found $COUNT:"
            printf "%s\n" "$FOUND"
            exit 1
          fi

      - name: Stage native libs for Gradle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp bridge/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          COUNT=$(find app/src/main/jniLibs/arm64-v8a -name "*.so" | wc -l)
          if [ "$COUNT" -ne 2 ]; then
            echo "expected 2 staged .so files, found $COUNT"
            exit 1
          fi

      - name: Run unit tests (incl. Robolectric startup gate)
        run: ./gradlew :app:testDebugUnitTest

      - name: Restore release keystore from secret
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/howlingdog-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/howlingdog-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release signature (signed with the release keystore, not the debug key)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify "$APK" || {
            echo "apksigner verify failed — the APK is not properly signed"
            exit 1
          }
          APK_CERT=$("$APKSIGNER" verify --print-certs --verbose "$APK" | grep "SHA-256 digest" | awk '{print $NF}' | head -1 | tr 'A-F' 'a-f')
          # keytool prints the fingerprint colon-separated and upper-case
          # (DF:EF:...), apksigner prints it bare and lower-case
          # (dfef...): normalise both to the same form before comparing.
          KS_CERT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "SHA256:" | awk '{print $NF}' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK certificate SHA-256: $APK_CERT"
          echo "Keystore certificate SHA-256: $KS_CERT"
          if [ "$APK_CERT" != "$KS_CERT" ]; then
            echo "APK is NOT signed with the release keystore certificate"
            exit 1
          fi
          echo "release APK is signed with the release keystore" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk)
          # Write the release notes to a file first: a multi-line
          # --notes "..." string inside this literal block scalar
          # breaks the YAML (its continuation lines sit at column 0
          # and terminate the block), so --notes-file is used instead.
          {
            echo "HowlingDog $TAG."
            echo ""
            echo "A standalone Neo Geo emulator for Android (AES / MVS / Neo Geo CD / Neo Geo CDZ) around the Geolith libretro core."
            echo ""
            echo "## Bug fixes"
            echo "- Fixed the RetroAchievements login failing with \"No response\": a rejected login now says why — wrong username or API key, no connection, or the server not answering."
            echo "- Various bug fixes and stability improvements."
            echo ""
            echo "## Maintenance"
            echo "- General maintenance."
            echo ""
            echo "Install the APK below on an Android device (arm64). BIOS files and games are user-supplied and never bundled — see the README for what to supply."
            echo ""
            echo "HowlingDog is not affiliated with or endorsed by SNK Corporation."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --title "HowlingDog $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$APK"
